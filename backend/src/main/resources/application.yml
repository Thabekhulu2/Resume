server:
  port: ${BACKEND_PORT:8081}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55322/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

temporal:
  address: ${TEMPORAL_ADDRESS:temporal:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:main}

resumes:
  storage-dir: ${RESUMES_STORAGE_DIR:/data/resumes}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

llm:
  use-local: ${USE_LOCAL_LLM:false}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
