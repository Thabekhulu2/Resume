name: resume-stack

services:
  backend:
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
    command: ["mvn", "-q", "spring-boot:run"]

  frontend-angular:
    volumes:
      - ./frontend-angular:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
