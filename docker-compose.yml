name: resume-stack

# The full local Supabase stack (API/Kong, Auth, Storage, Studio, Postgres) is
# run by the Supabase CLI via `supabase start`, NOT by this compose file --
# `make up` starts it first. Services below reach it on the host:
#   browser/frontend      -> http://localhost:55321
#   in-container worker   -> http://host.docker.internal:55321
# (Ports remapped off the Supabase CLI defaults -- see supabase/config.toml --
# to avoid colliding with other local Supabase stacks on this machine.)

services:
  temporal-db:
    image: postgres:15-alpine
    container_name: resume-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "55433:5432"
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.21.3
    container_name: resume-temporal
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - TEMPORAL_CLI_ADDRESS=localhost:7233
    ports:
      - "57234:7233"
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal-ui:
    image: temporalio/ui:2.21.2
    container_name: resume-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:53900
    ports:
      - "58080:8080"

  temporal-worker:
    build: ./temporal
    container_name: resume-temporal-worker
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    # Reach the host-bound Supabase API from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-main}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:55321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-dev-service-role-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-0}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - RESUMES_STORAGE_BUCKET=${RESUMES_STORAGE_BUCKET:-resumes}
      - HTTP_TRIGGER_PORT=${HTTP_TRIGGER_PORT:-8001}
    # Publish the HTTP trigger port to the host so the Supabase Edge Function
    # (running in the separate supabase-CLI-managed Docker network) can reach
    # it via host.docker.internal -- container-name DNS only works within the
    # same compose network.
    ports:
      - "58001:8001"

  frontend:
    build:
      context: ./frontend
    container_name: resume-frontend
    depends_on:
      temporal:
        condition: service_started
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:55321}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-dev-anon-key}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:55321/functions/v1}
    ports:
      - "53900:3000"

  # New Spring Boot + Angular stack (ticket #29 migration), running alongside
  # the existing Python/React services above until cutover (Phase 7).
  backend:
    build: ./backend
    container_name: resume-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_URL=${BACKEND_DB_URL:-jdbc:postgresql://host.docker.internal:55322/postgres}
      - DB_USERNAME=${BACKEND_DB_USERNAME:-postgres}
      - DB_PASSWORD=${BACKEND_DB_PASSWORD:-postgres}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-main}
      - RESUMES_STORAGE_DIR=${RESUMES_STORAGE_DIR:-/data/resumes}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:54200,http://localhost:4200}
    volumes:
      - backend-resumes-data:/data/resumes
    ports:
      - "58081:8081"

  frontend-angular:
    build:
      context: ./frontend-angular
    container_name: resume-frontend-angular
    depends_on:
      - backend
    environment:
      - API_URL=${ANGULAR_API_URL:-http://localhost:58081/api}
    ports:
      - "54200:4200"

volumes:
  temporal-db-data:
  backend-resumes-data:
