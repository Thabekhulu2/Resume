<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-header">Candidate Scoring</div>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/jobs" routerLinkActive="active">Jobs</a>
    <a routerLink="/candidates" routerLinkActive="active">Candidate History</a>
    <a routerLink="/interviews" routerLinkActive="active">Scheduled Interviews</a>

  </nav>
  <div class="content">
    <router-outlet />
  </div>
</div>
