[project]
name = "boilerplate-temporal"
version = "0.0.1"
description = "Temporal worker stub for boilerplate stack"
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.5.0",
  "pydantic==2.7.3",
  "pydantic-settings==2.4.0",
  "supabase==2.7.4",
  "anthropic==0.34.2",
  "pypdf==4.3.1",
  "python-docx==1.1.2",
  "aiohttp==3.10.5"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-json-report"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
